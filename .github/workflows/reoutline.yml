name: 調整集數

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      slug:
        description: 劇代號（例如 s2）
        required: true
      episodes:
        description: 總集數
        required: true
      seconds:
        description: 每集秒數
        required: true

permissions:
  contents: write
  issues: write

concurrency:
  group: saga-reoutline-${{ inputs.slug || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  reoutline:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.comment.body, '/reoutline') &&
       github.event.comment.user.login == github.repository_owner &&
       contains(github.event.issue.labels.*.name, '新劇'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 解析指令
        id: args
        env:
          COMMENT: ${{ github.event.comment.body }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SLUG="${{ inputs.slug }}"; N="${{ inputs.episodes }}"; SEC="${{ inputs.seconds }}"
          else
            SLUG="s${{ github.event.issue.number }}"
            set -- $(printf '%s' "$COMMENT" | head -1 | grep -oE '[0-9]+')
            N="$1"; SEC="$2"
            gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" -f content=eyes >/dev/null || true
          fi
          [ -n "$N" ] && [ -n "$SEC" ] || { echo "用法：/reoutline 集數 秒數，例如 /reoutline 60 50"; exit 1; }
          { echo "slug=$SLUG"; echo "episodes=$N"; echo "seconds=$SEC"; } >> "$GITHUB_OUTPUT"
      - name: 重排大綱
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -o pipefail
          python -m saga.cli reoutline --slug "${{ steps.args.outputs.slug }}" --episodes "${{ steps.args.outputs.episodes }}" --seconds "${{ steps.args.outputs.seconds }}" | tee "$RUNNER_TEMP/out.md"
      - name: 存下中途進度
        if: failure()
        run: scripts/commit.sh "${{ steps.args.outputs.slug }}：重排大綱（中途進度）"

      - name: 存檔並回報
        run: |
          git rm -q --cached -r "series/${{ steps.args.outputs.slug }}/episodes" 2>/dev/null || true
          scripts/commit.sh "${{ steps.args.outputs.slug }}：調整為 ${{ steps.args.outputs.episodes }} 集 × ${{ steps.args.outputs.seconds }} 秒，重排大綱"
          ISSUE="${{ steps.args.outputs.slug }}"; ISSUE="${ISSUE#s}"
          { echo "📐 已調整為 **${{ steps.args.outputs.episodes }} 集 × ${{ steps.args.outputs.seconds }} 秒**，大綱已依原規劃重新濃縮（保留結局），舊分鏡已清除。"; echo; sed -n '/^## /,$p' "$RUNNER_TEMP/out.md"; } > "$RUNNER_TEMP/body.md"
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/body.md"

      - name: 失敗通知
        if: failure() && steps.args.outputs.slug != ''
        run: |
          ISSUE="${{ steps.args.outputs.slug }}"; ISSUE="${ISSUE#s}"
          gh issue comment "$ISSUE" --body "⚠️ 調整集數失敗，請看[執行紀錄](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})。"
