name: 短劇生產

# 一次做一批（預設 10 集），做完自動接力下一批，直到範圍內全部完成。
#   /produce all          整部劇做到完
#   /produce 1-10         指定範圍
#   /produce 5 --rewrite  重寫並重做第 5 集
#   /produce all --video  關鍵鏡頭做成真影片（實驗性）

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      slug:
        description: 劇代號（例如 s1）
        required: true
      eps:
        description: 集數範圍（例如 1-10 或 all）
        default: all
      batch:
        description: 每批幾集
        default: "10"
      video:
        description: 關鍵鏡頭做成真影片（實驗性）
        type: boolean
        default: false
      rewrite:
        description: 重寫這批的分鏡
        type: boolean
        default: false
      redo:
        description: 重做這批的畫面與配音（沿用現有劇本）
        type: boolean
        default: false
      revoice:
        description: 只重錄配音（沿用畫面）
        type: boolean
        default: false
      issue:
        description: 回報進度的 Issue 編號（接力時自動帶入）
        default: ""
      attempt:
        description: 連續沒有進度的次數（接力時自動帶入）
        default: "0"

permissions:
  contents: write
  issues: write
  actions: write   # 自動接力下一批

concurrency:
  group: saga-kaggle   # Kaggle 同一時間只跑一個，避免搶 GPU 額度
  cancel-in-progress: false

jobs:
  # ── 1. 分鏡＋配音＋Kaggle 算圖（GPU 只能一個一個來）──────────────
  render:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.comment.body, '/produce') &&
       github.event.comment.user.login == github.repository_owner &&
       contains(github.event.issue.labels.*.name, '新劇'))
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      slug: ${{ steps.args.outputs.slug }}
      eps: ${{ steps.args.outputs.eps }}
      batch_size: ${{ steps.args.outputs.batch }}
      issue: ${{ steps.args.outputs.issue }}
      attempt: ${{ steps.args.outputs.attempt }}
      video: ${{ steps.args.outputs.video }}
      batch: ${{ steps.run.outputs.batch }}
      remaining: ${{ steps.run.outputs.remaining }}
      timing: ${{ steps.run.outputs.timing }}
    steps:
      - uses: actions/checkout@v4

      - name: 解析指令
        id: args
        env:
          COMMENT: ${{ github.event.comment.body }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SLUG="${{ inputs.slug }}"; EPS="${{ inputs.eps }}"; BATCH="${{ inputs.batch }}"
            ISSUE="${{ inputs.issue }}"; ATTEMPT="${{ inputs.attempt }}"
            VIDEO="${{ inputs.video }}"; REWRITE="${{ inputs.rewrite }}"; REDO="${{ inputs.redo }}"; REVOICE="${{ inputs.revoice }}"
            [ -z "$ISSUE" ] && ISSUE="${SLUG#s}"
          else
            ISSUE="${{ github.event.issue.number }}"; SLUG="s$ISSUE"; BATCH=10; ATTEMPT=0
            LINE=$(printf '%s' "$COMMENT" | head -1)
            if printf '%s' "$LINE" | grep -qiE '(^| )all( |$)|全部'; then EPS=all
            else EPS=$(printf '%s' "$LINE" | grep -oE '[0-9][0-9,\-]*' | head -1); fi
            VIDEO=false; REWRITE=false; REDO=false; REVOICE=false
            printf '%s' "$LINE" | grep -q -- '--video' && VIDEO=true
            printf '%s' "$LINE" | grep -q -- '--rewrite' && REWRITE=true
            printf '%s' "$LINE" | grep -q -- '--redo' && REDO=true
            printf '%s' "$LINE" | grep -q -- '--revoice' && REVOICE=true
            gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" -f content=rocket >/dev/null || true
          fi
          [ -z "$EPS" ] && { echo "沒有集數，例：/produce all 或 /produce 1-10"; exit 1; }
          [ -f "series/$SLUG/bible.json" ] || { echo "找不到 series/$SLUG"; exit 1; }
          FLAGS=""
          [ "$VIDEO" = "true" ] && FLAGS="$FLAGS --video"
          [ "$REWRITE" = "true" ] && FLAGS="$FLAGS --rewrite"
          [ "$REDO" = "true" ] && FLAGS="$FLAGS --redo"
          [ "$REVOICE" = "true" ] && FLAGS="$FLAGS --revoice"
          {
            echo "slug=$SLUG"; echo "eps=$EPS"; echo "batch=$BATCH"; echo "issue=$ISSUE"
            echo "attempt=$ATTEMPT"; echo "video=$VIDEO"; echo "flags=$FLAGS"
          } >> "$GITHUB_OUTPUT"

      - name: 查已完成的集數
        id: done
        run: |
          SKIP=""
          if [ "${{ contains(steps.args.outputs.flags, '--rewrite') || contains(steps.args.outputs.flags, '--redo') || contains(steps.args.outputs.flags, '--revoice') }}" != "true" ]; then
            SKIP=$(gh release view "${{ steps.args.outputs.slug }}" --json assets -q '.assets[].name' 2>/dev/null \
              | sed -nE 's/.*-ep0*([0-9]+)\.mp4$/\1/p' | sort -n | paste -sd, -)
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "已完成：${SKIP:-無}"

      - name: 安裝
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 取回上次算好的圖（斷點續跑）
        uses: actions/cache/restore@v4
        with:
          path: build/${{ steps.args.outputs.slug }}/ep*/shots
          key: saga-shots-v3-${{ steps.args.outputs.slug }}-${{ github.run_id }}
          restore-keys: saga-shots-v3-${{ steps.args.outputs.slug }}-

      - name: 分鏡、配音、算圖
        id: run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          SAGA_TIME_BUDGET_MIN: "200"
        run: |
          python -m saga.cli produce --slug "${{ steps.args.outputs.slug }}" \
            --eps "${{ steps.args.outputs.eps }}" --skip "${{ steps.done.outputs.skip }}" \
            --batch "${{ steps.args.outputs.batch }}" ${{ steps.args.outputs.flags }} \
            --no-assemble --status-out "$RUNNER_TEMP/status.json"
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          s = json.load(open(os.environ["RUNNER_TEMP"] + "/status.json"))
          print("batch=" + json.dumps(s["batch"]))
          print("remaining=" + ",".join(map(str, s["remaining"])))
          t = s.get("timing", {})
          print("timing=" + (f"分鏡 {t.get('scripts', 0) / 60:.1f} 分 ｜ 配音＋算圖 {(t.get('render', 0) - t.get('scripts', 0)) / 60:.1f} 分" if t else ""))
          EOF

      - name: 保存已算好的圖
        if: always() && steps.args.outputs.slug != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: build/${{ steps.args.outputs.slug }}/ep*/shots
          key: saga-shots-v3-${{ steps.args.outputs.slug }}-${{ github.run_id }}

      - name: 交給剪輯
        if: steps.run.outputs.batch != '[]' && steps.run.outputs.batch != ''
        uses: actions/upload-artifact@v4
        with:
          name: saga-${{ github.run_id }}
          path: |
            build/${{ steps.args.outputs.slug }}/ep*/shots/
            build/${{ steps.args.outputs.slug }}/ep*/audio/
          retention-days: 1
          compression-level: 0

      - name: 存劇本與定妝照
        if: always() && steps.args.outputs.slug != ''
        run: |
          git config user.name "saga-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add series
          if ! git diff --cached --quiet; then
            git commit -m "生產 ${{ steps.args.outputs.slug }}：分鏡與定妝照"
            git pull --rebase && git push
          fi

      - name: 準備 Release
        if: steps.run.outputs.batch != '[]' && steps.run.outputs.batch != ''
        run: |
          SLUG="${{ steps.args.outputs.slug }}"
          TITLE=$(python -c "import json;print(json.load(open('series/$SLUG/bible.json',encoding='utf-8'))['title'])")
          gh release view "$SLUG" >/dev/null 2>&1 || gh release create "$SLUG" --title "《$TITLE》" --notes "由 SAGA.AI 自動生產" --latest=false

      - name: 失敗通知
        if: failure() && steps.args.outputs.issue != ''
        run: |
          gh issue comment "${{ steps.args.outputs.issue }}" --body "⚠️ 生產失敗，已停止接力。請看[執行紀錄](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})；修正後留言 \`/produce all\` 會從中斷處繼續。"

  # ── 2. 平行剪輯：每集一台主機同時做 ───────────────────────────
  assemble:
    needs: render
    if: needs.render.outputs.batch != '[]' && needs.render.outputs.batch != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        ep: ${{ fromJSON(needs.render.outputs.batch) }}
    env:
      GH_TOKEN: ${{ github.token }}
      SLUG: ${{ needs.render.outputs.slug }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: 安裝 FFmpeg 與中文字型
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk > /dev/null
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: saga-${{ github.run_id }}
          path: build/${{ needs.render.outputs.slug }}
      - name: 剪輯第 ${{ matrix.ep }} 集
        run: python -m saga.cli assemble --slug "$SLUG" --ep ${{ matrix.ep }}
      - name: 上傳成片
        run: |
          N=$(printf '%02d' ${{ matrix.ep }})
          gh release upload "$SLUG" "build/$SLUG/$SLUG-ep$N.mp4" "build/$SLUG/$SLUG-ep$N.jpg" --clobber

  # ── 3. 回報並接力下一批 ───────────────────────────────────────
  report:
    needs: [render, assemble]
    if: always() && needs.render.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: 回報並接力
        run: |
          SLUG="${{ needs.render.outputs.slug }}"; ISSUE="${{ needs.render.outputs.issue }}"
          BATCH=$(echo '${{ needs.render.outputs.batch }}' | tr -d '[] ')
          REMAINING="${{ needs.render.outputs.remaining }}"
          ATTEMPT="${{ needs.render.outputs.attempt }}"
          DONE_NAMES=$(gh release view "$SLUG" --json assets -q '.assets[].name' 2>/dev/null)
          TOTAL=$(echo "$DONE_NAMES" | grep -c '\.mp4$' || true)
          ALL=$(python3 -c "import json;print(json.load(open('series/$SLUG/bible.json',encoding='utf-8'))['episode_count'])")
          DONE=""; for e in $(echo "$BATCH" | tr ',' ' '); do
            echo "$DONE_NAMES" | grep -q "$SLUG-ep$(printf '%02d' $e).mp4" && DONE="$DONE${DONE:+,}$e"
          done
          ASM="${{ needs.assemble.result }}"
          if [ -n "$DONE" ]; then ATTEMPT=0; else ATTEMPT=$((ATTEMPT + 1)); fi

          if [ -z "$REMAINING" ] && [ "$TOTAL" -ge "$ALL" ]; then
            MSG="🎉 全部完成！共 $TOTAL／$ALL 集。（本批：第 ${DONE:-無} 集）"
          elif [ -z "$REMAINING" ] && [ "$ASM" = "success" ]; then
            MSG="✅ 第 ${DONE:-無} 集完成（累計 $TOTAL／$ALL 集）。指定範圍已做完。"
          elif [ "$ATTEMPT" -ge 3 ]; then
            MSG="⚠️ 連續 3 批沒有進度，已停止接力。請看[執行紀錄](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})。"
          else
            MSG="✅ 第 ${DONE:-無} 集完成（累計 $TOTAL／$ALL 集），接力下一批中…"
            gh workflow run produce.yml -f slug="$SLUG" -f eps="${{ needs.render.outputs.eps }}" \
              -f batch="${{ needs.render.outputs.batch_size }}" -f video="${{ needs.render.outputs.video }}" \
              -f issue="$ISSUE" -f attempt="$ATTEMPT"
          fi
          [ -n "${{ needs.render.outputs.timing }}" ] && MSG="$MSG"$'\n\n'"⏱ ${{ needs.render.outputs.timing }} ｜ 剪輯 10 台平行"
          [ -n "$ISSUE" ] && gh issue comment "$ISSUE" --body "$MSG"
