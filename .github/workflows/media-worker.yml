name: 影片轉送站部署

# 部署 Cloudflare Worker，讓 iPhone／iPad 能播放 Release 影片；完成後把網址寫進 docs/media.json，App 自動改用。
# 需要 Secrets：CLOUDFLARE_API_TOKEN（範本「編輯 Cloudflare Workers」）、CLOUDFLARE_ACCOUNT_ID
on:
  push:
    branches: [main]
    paths: [worker/**]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: saga-media-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 檢查金鑰
        id: key
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$T" ] && echo "CLOUDFLARE_API_TOKEN：已讀到（${#T} 字元）" || echo "CLOUDFLARE_API_TOKEN：讀不到"
          # 只描述格式，絕不印出任何權杖字元
          case "$T" in *" "*|*$'\n'*|*$'\t'*) echo "⚠ 權杖內含空白或換行（可能連同說明文字或 curl 指令一起貼上）";; esac
          h=$(( ${#T} / 2 )); [ $(( ${#T} % 2 )) -eq 0 ] && [ "${T:0:$h}" = "${T:$h}" ] && echo "⚠ 權杖前後兩半完全相同：貼了兩次"
          printf '%s' "$T" | LC_ALL=C grep -q '[^A-Za-z0-9_.=-]' && echo "⚠ 權杖內含英數字以外的字元（例如全形字或引號）"
          case "$T" in *Bearer*|*curl*|*http*) echo "⚠ 權杖內含 Bearer／curl／網址字樣：貼到的是測試指令，不是權杖本身";; esac
          [ -n "$A" ] && echo "CLOUDFLARE_ACCOUNT_ID：已讀到（${#A} 字元）" || echo "CLOUDFLARE_ACCOUNT_ID：讀不到"
          if [ -z "$T" ] || [ -z "$A" ]; then
            echo "::warning::尚未設定 CLOUDFLARE_API_TOKEN／CLOUDFLARE_ACCOUNT_ID，先略過部署（設定後手動重跑本工作）"
          else echo "ok=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.key.outputs.ok == '1'
        with:
          node-version: "22"
      - name: 部署
        if: steps.key.outputs.ok == '1'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: 取得網址並驗證 iOS 需要的標頭
        if: steps.key.outputs.ok == '1'
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          sub=$(curl -fsS -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/accounts/$A/workers/subdomain" \
                | python3 -c "import json,sys;print(json.load(sys.stdin)['result']['subdomain'])")
          base="https://saga-media.$sub.workers.dev"
          # 找第一個含成片的 Release 做驗證（lab12 等試拍 tag 可能還沒有影片）
          read tag name < <(curl -fsS "https://api.github.com/repos/${{ github.repository }}/releases?per_page=30" | python3 -c "
          import json,sys
          for r in json.load(sys.stdin):
              m=[a['name'] for a in r['assets'] if a['name'].endswith('.mp4')]
              if m: print(r['tag_name'], m[0]); break")
          echo "驗證檔：$tag/$name"
          sleep 10
          hdr=$(curl -sS -D - -o /dev/null -H "Range: bytes=0-1" "$base/$tag/$name")
          echo "$hdr"
          echo "$hdr" | grep -qi "^HTTP/.* 206" || { echo "::error::轉送站沒有回 206 分段內容"; exit 1; }
          echo "$hdr" | grep -qi "content-type: video/mp4" || { echo "::error::轉送站的格式標頭不對"; exit 1; }
          printf '{"base": "%s"}\n' "$base" > docs/media.json
          git config user.name "saga-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/media.json
          git diff --cached --quiet || { git commit -qm "影片轉送站網址 [skip ci]"; git pull -q --rebase origin main; git push -q origin HEAD:main; }
          echo "轉送站上線：$base"
