name: 診斷

on:
  workflow_dispatch:
    inputs:
      kernel:
        description: 要看的 Kaggle notebook（saga-render / saga-lab / saga-bench）
        default: saga-render

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt

      - name: LLM 供應商
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python - <<'EOF'
          from saga import llm
          for p in llm._get_providers():
              for m in p.models()[:2]:
                  try:
                      print("OK ", p.name, m, llm._extract_json(p.call(m, '回傳 JSON：{"ok": true, "說": "你好"}', 0.2)))
                  except Exception as e:
                      print("ERR", p.name, m, str(e)[:200])
          EOF

      - name: Modal 配音測試
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          python - <<'EOF'
          import time
          from pathlib import Path
          from saga import modal_tts, tts
          lines = [{"key": f"t{i}", "voice": v, "text": t, "emo": tts.EMO[e]} for i, (v, t, e) in enumerate([
              ("m11", "五年了，我回來了。", "calm"), ("m09", "你以為你掌控了一切？", "angry"),
              ("f07", "陳先生，一切都準備好了。", "calm"), ("f01", "這不可能！", "surprised"),
              ("m07", "沒有人知道，他手上握著什麼。", "calm")] * 4)]
          t = time.time()
          got = modal_tts.synthesize(lines, {v: tts.VOICE_DIR / f"{v}.wav" for v in {l["voice"] for l in lines}}, Path("/tmp/modal_test"))
          print(f"MODAL RESULT {len(got)}/{len(lines)} in {time.time() - t:.0f}s")
          EOF

      - name: Kaggle 日誌
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          case "$KAGGLE_KEY" in KGAT_*) export KAGGLE_API_TOKEN="$KAGGLE_KEY";; esac
          for k in ${{ inputs.kernel || 'saga-render' }}; do
            echo "=================== $k status"; kaggle kernels status "$KAGGLE_USERNAME/$k" || true
            echo "=================== $k timeline"
            kaggle kernels logs "$KAGGLE_USERNAME/$k" 2>&1 | python -c "
          import sys, json, re
          raw = sys.stdin.read()
          try:
              items = json.loads(raw[raw.index('['):])
          except Exception:
              print(raw[-4000:]); sys.exit()
          for it in items:
              d = str(it.get('data', '')).rstrip()
              if re.search(r'\[ *[0-9.]+m\]|Error|Traceback|Exception', d): print(f\"{it.get('time', 0):7.0f}s\", d[:200])
          " | head -120 || true
          done
          mkdir -p out && kaggle kernels output "$KAGGLE_USERNAME/${{ inputs.kernel || 'saga-render' }}" -p out -o >/dev/null 2>&1 || true
          echo "== render output files"; ls -la out | head -30
          cat out/manifest.json 2>/dev/null | head -c 1500 || true

      - name: Edge-TTS
        run: |
          python - <<'EOF'
          import asyncio, edge_tts, time
          voices = ["zh-TW-HsiaoChenNeural","zh-TW-HsiaoYuNeural","zh-TW-YunJheNeural","zh-CN-YunxiNeural",
                    "zh-CN-YunjianNeural","zh-CN-XiaoyiNeural","zh-CN-YunyangNeural","zh-CN-XiaoxiaoNeural"]
          async def one(v, i):
              try:
                  await edge_tts.Communicate("五年了，我回來了。", v, rate="+8%").save(f"/tmp/{i}.mp3"); return "ok"
              except Exception as e:
                  return type(e).__name__
          async def main():
              for v in voices:
                  print(v, await one(v, v))
              t = time.time()
              r = await asyncio.gather(*(one(voices[i % 8], i) for i in range(16)))
              print("16 concurrent:", r, f"{time.time()-t:.1f}s")
          asyncio.run(main())
          EOF
