name: 排程上架

# schedule/publish.json 裡的項目時間到了就觸發「批次上架」。GitHub 的定時執行可能晚 5～15 分鐘。
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  push:
    paths: [schedule/publish.json]   # 新增／修改排程 → 在 Discord 公告（bot 標記完成的 commit 帶 [skip ci] 不會觸發）
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# 定時巡檢（cron）與「睡到時間」的守時工作分開排隊：
# 11/12 曾發生 cron 巡檢把正在睡等 12:00 的工作取消掉，導致沒人守時。
concurrency:
  group: saga-schedule-${{ github.event_name == 'schedule' && 'cron' || 'sleeper' }}
  cancel-in-progress: true   # 同類的新一輪取代舊的（例如排程改了）

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 已有守時工作在睡等 → 巡檢讓位
        id: guard
        if: github.event_name == 'schedule'
        run: |
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow schedule.yml --status in_progress --json event \
                -q '[.[] | select(.event != "schedule")] | length')
          if [ "${n:-0}" -gt 0 ]; then echo "守時工作進行中，本次巡檢跳過"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != '1'
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != '1'
        with:
          python-version: "3.12"
      - run: pip install -q requests
        if: steps.guard.outputs.skip != '1'
      - name: 公告排程
        if: github.event_name == 'push'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python -m saga.notify --schedule
      - name: 到期的就上架
        if: steps.guard.outputs.skip != '1'
        run: python3 scripts/run_schedule.py && scripts/save_schedule.sh
      - name: 等到下一個排程（不靠 GitHub 定時器）
        id: wait
        if: github.event_name != 'schedule'
        run: |
          # 下一個未完成項目在 5.3 小時內 → 這個工作直接睡到那個時間；更遠的話先睡 5.3 小時再接下一輪
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timezone
          items = [i for i in json.load(open("schedule/publish.json")) if not i.get("done")]
          if not items:
              print("more=0"); raise SystemExit
          nxt = min(datetime.fromisoformat(i["at"]) for i in items)
          wait = (nxt - datetime.now(timezone.utc)).total_seconds()
          print(f"sleep={int(max(0, min(wait + 30, 5.3 * 3600)))}"); print("more=1")
          PY
      - name: 睡到時間
        if: steps.wait.outputs.more == '1'
        run: sleep ${{ steps.wait.outputs.sleep }}
      - name: 時間到 → 上架
        if: steps.wait.outputs.more == '1'
        run: |
          git pull -q --rebase origin main
          python3 scripts/run_schedule.py && scripts/save_schedule.sh
      - name: 還有後續排程就再接一輪
        if: steps.wait.outputs.more == '1'
        run: |
          left=$(python3 -c "import json;print(sum(1 for i in json.load(open('schedule/publish.json')) if not i.get('done')))")
          [ "$left" -gt 0 ] && gh workflow run schedule.yml || echo "排程全部完成"
