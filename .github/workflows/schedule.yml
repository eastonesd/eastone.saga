name: 排程上架

# schedule/publish.json 裡的項目時間到了就觸發「批次上架」。GitHub 的定時執行可能晚 5～15 分鐘。
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  push:
    paths: [schedule/publish.json]   # 新增／修改排程 → 在 Discord 公告（bot 標記完成的 commit 帶 [skip ci] 不會觸發）
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: saga-schedule
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: 公告排程
        if: github.event_name != 'schedule'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python -m saga.notify --schedule
      - name: 到期的就上架
        if: github.event_name == 'schedule'
        run: python3 scripts/run_schedule.py
      - name: 存檔
        run: |
          git config user.name "saga-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule
          git diff --cached --quiet && exit 0
          git commit -q -m "排程上架：已觸發 [skip ci]"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
