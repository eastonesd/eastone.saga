name: 新劇企劃

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: saga-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  plan:
    # 只有 repo 擁有者開的、標了「新劇」的 Issue 才會觸發（公開 repo 防路人濫用）
    if: >-
      contains(github.event.issue.labels.*.name, '新劇') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SLUG: s${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: 檢查是否已企劃過
        id: check
        run: |
          git pull -q origin main   # 同一個 Issue 會同時觸發兩次（開立＋貼標籤）；以最新內容判斷是否已企劃
          if [ -f "series/$SLUG/bible.json" ]; then echo "done=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.done != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝
        if: steps.check.outputs.done != 'true'
        run: pip install -r requirements.txt

      - name: 回報開工
        if: steps.check.outputs.done != 'true'
        run: gh issue comment ${{ github.event.issue.number }} --body "🤵 收到靈感，編劇部開工中…（[執行紀錄](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})）"

      - name: 寫劇本聖經與全劇大綱
        if: steps.check.outputs.done != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s' "$ISSUE_BODY" > "$RUNNER_TEMP/issue.md"
          python -m saga.cli plan --slug "$SLUG" --issue-file "$RUNNER_TEMP/issue.md"
          python -m saga.cli summary --slug "$SLUG" > "$RUNNER_TEMP/summary.md"

      - name: 存進 repo
        if: steps.check.outputs.done != 'true'
        run: scripts/commit.sh "企劃 $SLUG：劇本聖經與大綱（#${{ github.event.issue.number }}）"

      - name: 回報結果
        if: steps.check.outputs.done != 'true'
        run: |
          TITLE=$(python -c "import json;print(json.load(open('series/$SLUG/bible.json',encoding='utf-8'))['title'])")
          gh issue edit ${{ github.event.issue.number }} --title "《$TITLE》($SLUG)"
          gh issue comment ${{ github.event.issue.number }} --body-file "$RUNNER_TEMP/summary.md"

      # 大綱一出來就先回報，分鏡在背景接著寫完全劇，生產時 GPU 就不必等 LLM
      - name: 先寫好全劇分鏡
        if: steps.check.outputs.done != 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -o pipefail
          timeout 130m python -m saga.cli scripts --slug "$SLUG" --workers 2 | tee "$RUNNER_TEMP/scripts.log"

      - name: 存分鏡並回報
        if: always() && steps.check.outputs.done != 'true'
        run: |
          scripts/commit.sh "$SLUG：全劇分鏡劇本"
          N=$(ls series/$SLUG/episodes 2>/dev/null | wc -l)
          TOTAL=$(python -c "import json;print(json.load(open('series/$SLUG/bible.json',encoding='utf-8'))['episode_count'])" 2>/dev/null || echo 0)
          [ "$TOTAL" != "0" ] && gh issue comment ${{ github.event.issue.number }} --body "📝 分鏡劇本 $N／$TOTAL 集已就緒。留言 \`/produce all\` 開始全自動生產。"

      - name: 失敗通知
        if: failure()
        run: gh issue comment ${{ github.event.issue.number }} --body "⚠️ 企劃失敗，請看[執行紀錄](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})。修正後把「新劇」標籤拿掉再加回來即可重跑。"
