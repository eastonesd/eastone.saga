<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAGA.ai</title>
<meta name="description" content="丟一句靈感，自動生產整部 AI 短劇。">
<meta name="theme-color" content="#070A1F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SAGA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@112,500;112,700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --night: #070A1F;
  --ink: #0F1535;
  --ink-2: #161E48;
  --line: #262F63;
  --silver: #E8EBF7;
  --mist: #9198C4;
  --cyan: #3FD8FF;
  --violet: #8B5CF6;
  --danger: #FF6B8A;
  --ok: #5BE3B0;
  --glow: linear-gradient(110deg, var(--cyan), var(--violet));
  --display: "Saira", "Noto Sans TC", sans-serif;
  --body: "Noto Sans TC", system-ui, sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--night);
  background-image: radial-gradient(120% 60% at 50% -10%, #1A1450 0%, transparent 60%);
  background-attachment: fixed;
  color: var(--silver);
  font: 400 15px/1.65 var(--body);
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--cyan); }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }

/* ── 頂部 ── */
.top {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 10px;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
  background: rgba(7, 10, 31, .82);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(38, 47, 99, .6);
}
.top img { width: 30px; height: 30px; border-radius: 8px; }
.wordmark { font: 700 19px/1 var(--display); letter-spacing: .04em; }
.wordmark span { background: var(--glow); -webkit-background-clip: text; background-clip: text; color: transparent; }
.factory {
  margin-left: auto; display: flex; align-items: center; gap: 7px;
  font-size: 12.5px; color: var(--mist); text-decoration: none;
}
.factory i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.factory.on { color: var(--silver); }
.factory.on i { background: var(--cyan); box-shadow: 0 0 10px var(--cyan); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }

main { max-width: 640px; margin: 0 auto; padding: 20px 16px calc(96px + var(--safe-b)); }
h1 { font: 700 26px/1.3 var(--body); margin: 4px 0 6px; letter-spacing: .01em; }
h2 { font: 700 17px/1.4 var(--body); margin: 28px 0 10px; }
.lede { color: var(--mist); margin: 0 0 20px; }
.muted { color: var(--mist); }
.small { font-size: 13px; }

/* ── 表單 ── */
.field { margin-bottom: 18px; }
.field > label, .field > .label { display: block; font-weight: 500; margin-bottom: 8px; }
textarea, input[type=text], input[type=password], input[type=number] {
  width: 100%; background: var(--ink); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 14px; outline: none; transition: border-color .15s;
}
textarea:focus, input:focus { border-color: var(--cyan); }
textarea.idea { min-height: 150px; resize: vertical; font-size: 17px; line-height: 1.6; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--line); background: transparent; border-radius: 999px;
  padding: 6px 14px; cursor: pointer; font-size: 14px; color: var(--mist);
}
.chip[aria-pressed=true] { color: var(--night); background: var(--silver); border-color: var(--silver); font-weight: 500; }
.row { display: flex; gap: 12px; }
.row > * { flex: 1; }
.stepper { display: flex; align-items: center; background: var(--ink); border: 1px solid var(--line); border-radius: 12px; }
.stepper button { width: 44px; height: 46px; border: 0; background: none; font-size: 20px; color: var(--mist); cursor: pointer; }
.stepper input { border: 0; background: none; text-align: center; padding: 0; font: 700 18px var(--display); min-width: 0; }
.stepper input::-webkit-inner-spin-button { display: none; }
.toggle { display: flex; align-items: center; gap: 10px; padding: 10px 0; cursor: pointer; }
.toggle input { width: 20px; height: 20px; accent-color: var(--violet); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; border-radius: 14px; padding: 14px 20px; cursor: pointer;
  font-weight: 700; font-size: 16px; text-decoration: none;
}
.btn.primary { width: 100%; color: #fff; background: var(--glow); box-shadow: 0 8px 28px -10px rgba(139, 92, 246, .8); }
.btn.primary:disabled { opacity: .5; cursor: progress; }
.btn.ghost { background: var(--ink-2); color: var(--silver); }
.btn.text { background: none; color: var(--mist); padding: 8px 0; font-weight: 500; }

/* ── 劇集清單 ── */
.series-list { list-style: none; margin: 0; padding: 0; }
.series-list li + li { border-top: 1px solid var(--line); }
.series-item { display: flex; align-items: center; gap: 14px; padding: 16px 2px; text-decoration: none; color: inherit; }
.series-item .poster {
  width: 54px; aspect-ratio: 9/16; border-radius: 6px; flex: none; overflow: hidden;
  background: var(--ink-2) center/cover no-repeat; border: 1px solid var(--line);
}
.series-item .t { font-weight: 700; font-size: 16px; }
.series-item .meta { font-size: 13px; color: var(--mist); }
.progress { height: 3px; background: var(--line); border-radius: 2px; margin-top: 8px; overflow: hidden; }
.progress b { display: block; height: 100%; background: var(--glow); }
.pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--mist); }
.pill.live { color: var(--cyan); border-color: rgba(63, 216, 255, .4); }
.pill.bad { color: var(--danger); border-color: rgba(255, 107, 138, .4); }

.empty { text-align: center; padding: 48px 12px; }
.empty img { width: 132px; border-radius: 24px; margin-bottom: 18px; }

/* ── 底片（本 App 唯一的大膽元素） ── */
.film {
  --hole: 10px;
  margin: 18px -16px 6px; padding: 22px 16px;
  background:
    repeating-linear-gradient(90deg, transparent 0 8px, #2A3166 8px 18px, transparent 18px 26px) top 7px left 0 / 100% var(--hole) no-repeat,
    repeating-linear-gradient(90deg, transparent 0 8px, #2A3166 8px 18px, transparent 18px 26px) bottom 7px left 0 / 100% var(--hole) no-repeat,
    #03051A;
  border-block: 1px solid #1B2257;
  display: grid; grid-auto-flow: column; grid-auto-columns: 92px; gap: 8px;
  overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
}
.film::-webkit-scrollbar { display: none; }
.frame {
  position: relative; aspect-ratio: 9/16; border-radius: 4px; overflow: hidden; scroll-snap-align: start;
  background: #0B1030; border: 1px solid #1C2356; padding: 0; cursor: default; text-align: left;
}
.frame .n { position: absolute; left: 7px; top: 5px; font: 700 20px/1 var(--display); color: #3A4380; }
.frame .ft { position: absolute; inset: auto 6px 6px; font-size: 11px; line-height: 1.35; color: #6E76A8;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.frame.done { cursor: pointer; border-color: rgba(63, 216, 255, .35); background-size: cover; background-position: center; }
.frame.done::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 50%, rgba(3, 5, 26, .9)); }
.frame.done .n { color: #fff; z-index: 1; text-shadow: 0 1px 6px #000; }
.frame.done .ft { color: var(--silver); z-index: 1; }
.frame.queued { border-style: dashed; border-color: var(--violet); }
.frame.queued .n { color: var(--violet); }
.film-legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--mist); }

.hero-logline { font-size: 16px; color: var(--silver); margin: 0 0 4px; }
.cast { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13.5px; color: var(--mist); margin-top: 10px; }
.cast b { color: var(--silver); font-weight: 500; }
.panel { background: var(--ink); border: 1px solid var(--line); border-radius: 18px; padding: 18px; margin-top: 22px; }
.panel h2 { margin-top: 0; }

/* ── 動態 ── */
.feed { list-style: none; margin: 0; padding: 0; }
.feed li { padding: 14px 0; border-top: 1px solid var(--line); }
.feed .who { font-size: 12.5px; color: var(--mist); margin-bottom: 4px; }
.feed .md { overflow-wrap: anywhere; }
.feed .md table { border-collapse: collapse; font-size: 13px; display: block; overflow-x: auto; }
.feed .md td, .feed .md th { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
.feed .md h2, .feed .md h3 { font-size: 15px; margin: 12px 0 6px; }
.feed .md blockquote { margin: 6px 0; padding-left: 12px; border-left: 3px solid var(--violet); color: var(--mist); }
.feed .md code { background: var(--ink-2); padding: 1px 5px; border-radius: 5px; }
.feed .cmd { font: 500 14px var(--display); color: var(--cyan); }

/* ── 播放器 ── */
.sheet { position: fixed; inset: 0; z-index: 20; background: rgba(3, 5, 26, .94); display: flex; flex-direction: column; }
.sheet header { display: flex; align-items: center; gap: 12px; padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px; }
.sheet header .t { font-weight: 700; flex: 1; }
.sheet video { flex: 1; min-height: 0; width: 100%; background: #000; }
.sheet footer { display: flex; gap: 10px; padding: 12px 16px calc(12px + var(--safe-b)); }
.sheet footer .btn { flex: 1; padding: 12px; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--ink-2); font-size: 20px; cursor: pointer; }

/* ── 底部分頁 ── */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  display: flex; justify-content: center; gap: 4px;
  padding: 8px 12px calc(8px + var(--safe-b));
  background: rgba(7, 10, 31, .92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
}
.tabs a {
  flex: 1; max-width: 160px; text-align: center; text-decoration: none; color: var(--mist);
  padding: 8px 0 6px; border-radius: 12px; font-size: 13px; font-weight: 500;
}
.tabs a svg { display: block; margin: 0 auto 3px; width: 22px; height: 22px; }
.tabs a[aria-current=page] { color: var(--silver); background: var(--ink-2); }
.tabs a[aria-current=page] svg { stroke: var(--cyan); }

.toast {
  position: fixed; left: 50%; bottom: calc(86px + var(--safe-b)); transform: translateX(-50%);
  z-index: 30; max-width: calc(100% - 32px); background: var(--silver); color: var(--night);
  padding: 10px 16px; border-radius: 12px; font-weight: 500; font-size: 14px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
}
.toast.bad { background: var(--danger); color: #fff; }

.setup-logo { display: block; width: 168px; margin: 8px auto 18px; border-radius: 28px; box-shadow: 0 0 60px -10px rgba(63, 216, 255, .45); }
.steps { padding-left: 20px; color: var(--mist); }
.steps li { margin-bottom: 6px; }
.steps b { color: var(--silver); font-weight: 500; }
.skeleton { height: 70px; border-radius: 12px; background: linear-gradient(90deg, var(--ink) 0%, var(--ink-2) 50%, var(--ink) 100%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; margin-bottom: 10px; }
@keyframes shimmer { to { background-position: -200% 0; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<header class="top">
  <img src="icons/icon-192.png" alt="">
  <div class="wordmark">SAGA<span>.ai</span></div>
  <a class="factory" id="factory" target="_blank" rel="noopener" href="#"><i></i><span>工廠待命</span></a>
</header>

<main id="view" aria-live="polite"></main>

<nav class="tabs" id="tabs" aria-label="主選單">
  <a href="#/new" data-tab="new">

    新靈感
  </a>
  <a href="#/series" data-tab="series">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></svg>
    我的劇
  </a>
  <a href="#/settings" data-tab="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    設定
  </a>
